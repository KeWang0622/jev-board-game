<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jev Board Game · 上帝视角</title>
<style>
  :root{
    --bg0:#0b1020; --bg1:#131a33; --panel:rgba(255,255,255,.06);
    --stroke:rgba(255,255,255,.12); --txt:#e8ecff; --dim:#9aa3c7;
    --civ:#4ea3ff; --spy:#ff5d73; --good:#37d39b; --warn:#ffc857;
    --accent:#8b7dff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--txt);
    background:
      radial-gradient(1200px 800px at 70% -10%, #1c2650 0%, transparent 60%),
      radial-gradient(900px 700px at -10% 110%, #24123a 0%, transparent 55%),
      linear-gradient(160deg,var(--bg0),var(--bg1));
    min-height:100%;
  }
  header{
    display:flex;align-items:center;gap:14px;padding:16px 22px;
    border-bottom:1px solid var(--stroke);backdrop-filter:blur(6px);
  }
  header .logo{
    width:34px;height:34px;border-radius:10px;flex:0 0 auto;
    background:conic-gradient(from 210deg,var(--accent),var(--civ),var(--spy),var(--accent));
    box-shadow:0 6px 24px rgba(139,125,255,.4);
  }
  header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.3px}
  header .sub{color:var(--dim);font-size:13px;margin-left:2px}
  header .spacer{flex:1}
  select,button{
    font:inherit;color:var(--txt);background:var(--panel);
    border:1px solid var(--stroke);border-radius:10px;padding:8px 12px;cursor:pointer;
    transition:.15s;
  }
  button:hover,select:hover{border-color:var(--accent);background:rgba(139,125,255,.15)}
  button:disabled{opacity:.4;cursor:default}
  .wrap{display:grid;grid-template-columns:1fr 340px;gap:18px;padding:18px 22px;max-width:1280px;margin:0 auto}
  @media(max-width:980px){.wrap{grid-template-columns:1fr}}
  .stage{
    position:relative;border:1px solid var(--stroke);border-radius:20px;
    background:var(--panel);overflow:hidden;min-height:560px;
  }
  #board{display:block;width:100%;height:560px}
  .table-label{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    text-align:center;pointer-events:none;
  }
  .table-label .rd{font-size:13px;color:var(--dim);letter-spacing:2px;text-transform:uppercase}
  .table-label .phase{font-size:22px;font-weight:700;margin-top:4px}
  .player{position:absolute;transform:translate(-50%,-50%);width:150px;text-align:center;transition:.35s}
  .player .avatar{
    width:56px;height:56px;border-radius:50%;margin:0 auto 6px;
    display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;
    background:linear-gradient(160deg,#2a3566,#1a2244);border:2px solid var(--stroke);
    box-shadow:0 8px 20px rgba(0,0,0,.35);transition:.35s;
  }
  .player.spy .avatar{border-color:var(--spy);box-shadow:0 0 0 3px rgba(255,93,115,.25),0 8px 20px rgba(0,0,0,.35)}
  .player.speaking .avatar{border-color:var(--accent);box-shadow:0 0 0 4px rgba(139,125,255,.35)}
  .player.dead{opacity:.32;filter:grayscale(.7)}
  .player.dead .avatar::after{content:"✕";position:absolute;color:var(--spy);font-size:30px}
  .player .name{font-size:13px;font-weight:600}
  .player .word{font-size:12px;color:var(--dim);margin-top:2px}
  .player.spy .word{color:var(--spy);font-weight:700}
  .player .tag{font-size:10px;color:var(--spy);letter-spacing:.5px}
  .bubble{
    max-width:180px;margin:6px auto 0;padding:7px 10px;border-radius:12px;font-size:12px;line-height:1.3;
    background:rgba(78,163,255,.14);border:1px solid rgba(78,163,255,.35);opacity:0;transform:translateY(6px);
    transition:.3s;
  }
  .player.spy .bubble{background:rgba(255,93,115,.14);border-color:rgba(255,93,115,.4)}
  .bubble.show{opacity:1;transform:none}
  .susp{margin-top:6px;opacity:0;transition:.3s}
  .susp.show{opacity:1}
  .susp .row{display:flex;align-items:center;gap:6px;font-size:11px;margin-top:2px}
  .susp .who{width:22px;color:var(--dim)}
  .susp .track{flex:1;height:7px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
  .susp .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--civ),var(--accent));transition:width .5s}
  .susp .fill.hit{background:linear-gradient(90deg,var(--good),#7effc0)}
  .susp .pct{width:30px;text-align:right;color:var(--dim)}
  .vote-badge{
    position:absolute;transform:translate(-50%,-50%);background:var(--warn);color:#241a00;
    font-weight:800;font-size:12px;border-radius:20px;padding:2px 8px;box-shadow:0 4px 12px rgba(0,0,0,.4);
    opacity:0;transition:.3s;
  }
  .vote-badge.show{opacity:1}
  .controls{
    display:flex;align-items:center;gap:10px;padding:14px 18px;border-top:1px solid var(--stroke);
    position:absolute;left:0;right:0;bottom:0;background:rgba(10,14,30,.55);backdrop-filter:blur(8px);
  }
  .controls .prog{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}
  .controls .prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--civ));width:0}
  .side{display:flex;flex-direction:column;gap:14px}
  .card{border:1px solid var(--stroke);border-radius:16px;background:var(--panel);padding:14px 16px}
  .card h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim)}
  .kv{display:flex;justify-content:space-between;font-size:14px;margin:6px 0}
  .kv b{font-weight:700}
  .pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700}
  .pill.civ{background:rgba(78,163,255,.2);color:var(--civ)}
  .pill.spy{background:rgba(255,93,115,.2);color:var(--spy)}
  .log{font-size:12.5px;line-height:1.5;max-height:230px;overflow:auto}
  .log .ev{padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.08);color:var(--dim)}
  .log .ev b{color:var(--txt)}
  .winner{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
    background:radial-gradient(600px 400px at 50% 40%,rgba(139,125,255,.25),rgba(10,14,30,.9));
    backdrop-filter:blur(3px);z-index:5;
  }
  .winner.show{display:flex}
  .winner .big{font-size:40px;font-weight:900;letter-spacing:1px}
  .winner .small{color:var(--dim);margin-top:6px}
  .legend{font-size:12px;color:var(--dim);display:flex;gap:14px;flex-wrap:wrap}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
</style>
</head>
<body>
<header>
  <div class="logo"></div>
  <div>
    <h1>Jev Board Game <span class="sub">· Undercover · 上帝视角</span></h1>
  </div>
  <div class="spacer"></div>
  <label class="sub" for="gamesel">game</label>
  <select id="gamesel"></select>
</header>

<div class="wrap">
  <div class="stage">
    <svg id="board"></svg>
    <div class="table-label"><div class="rd" id="rdlabel">round</div><div class="phase" id="phaselabel">—</div></div>
    <div id="players"></div>
    <div id="votes"></div>
    <div class="winner" id="winner"><div class="big" id="winbig"></div><div class="small" id="winsmall"></div></div>
    <div class="controls">
      <button id="prev">◀</button>
      <button id="play">▶ Play</button>
      <button id="next">▶▶</button>
      <div class="prog"><i id="prog"></i></div>
      <select id="speed">
        <option value="1600">1×</option>
        <option value="900" selected>1.5×</option>
        <option value="500">3×</option>
      </select>
    </div>
  </div>

  <div class="side">
    <div class="card">
      <h3>Match</h3>
      <div class="kv"><span>Players</span><b id="m-players">—</b></div>
      <div class="kv"><span>Backend</span><b id="m-backend">—</b></div>
      <div class="kv"><span>Undercover</span><b id="m-spy" class="pill spy">—</b></div>
      <div class="kv"><span>Winner</span><b id="m-winner">—</b></div>
    </div>
    <div class="card">
      <h3>Event log</h3>
      <div class="log" id="log"></div>
    </div>
    <div class="card">
      <h3>Legend</h3>
      <div class="legend">
        <span><span class="dot" style="background:var(--civ)"></span>civilian</span>
        <span><span class="dot" style="background:var(--spy)"></span>undercover</span>
        <span><span class="dot" style="background:var(--good)"></span>correct suspicion</span>
        <span><span class="dot" style="background:var(--warn)"></span>votes</span>
      </div>
    </div>
  </div>
</div>

<script>
const GAMES = /*__GAMES__*/[];

const $ = s => document.querySelector(s);
const board = $("#board"), playersEl = $("#players"), votesEl = $("#votes");
let G=null, steps=[], cur=0, playing=false, timer=null, positions={};

function buildSteps(g){
  const s=[{type:"intro"}];
  g.rounds.forEach(r=>{
    s.push({type:"clues",r},{type:"suspicion",r},{type:"votes",r},{type:"eliminated",r});
  });
  s.push({type:"result"});
  return s;
}
function livingAt(g, roundIdx){
  const dead=new Set();
  for(const r of g.rounds){ if(r.index<roundIdx && r.eliminated) dead.add(r.eliminated); }
  return g.players.filter(p=>!dead.has(p.id));
}
function deadBefore(g, step){
  // players eliminated in rounds strictly before the current round, plus current if phase==eliminated
  const dead=new Set();
  const upto = step.r===undefined?g.rounds.length:step.r;
  for(const r of g.rounds){
    if(r.index<upto && r.eliminated) dead.add(r.eliminated);
    if(r.index===upto && step.type==="eliminated" && r.eliminated) dead.add(r.eliminated);
    if(r.index===upto && step.type==="result" && r.eliminated) dead.add(r.eliminated);
  }
  if(step.type==="result"){ for(const r of g.rounds) if(r.eliminated) dead.add(r.eliminated); }
  return dead;
}

function layout(){
  const W=board.clientWidth||board.parentElement.clientWidth, H=560;
  board.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const cx=W/2, cy=H/2-10, rx=Math.min(W*0.36,360), ry=Math.min(H*0.34,190);
  positions={};
  const n=G.players.length;
  G.players.forEach((p,i)=>{
    const a=-Math.PI/2 + i*2*Math.PI/n;
    positions[p.id]={x:cx+rx*Math.cos(a), y:cy+ry*Math.sin(a)};
  });
  positions.__center={x:cx,y:cy};
}

function renderPlayers(step){
  const dead=deadBefore(G, step);
  const round = step.r!==undefined ? G.rounds[step.r] : null;
  playersEl.innerHTML="";
  G.players.forEach(p=>{
    const pos=positions[p.id];
    const el=document.createElement("div");
    el.className="player"+(p.id===G.undercover_id?" spy":"")+(dead.has(p.id)?" dead":"");
    el.style.left=pos.x+"px"; el.style.top=pos.y+"px";
    const initial=p.id.replace(/[^0-9]/g,"")||p.id[0];
    let clue="", susp="";
    if(round && (step.type==="clues"||step.type==="suspicion"||step.type==="votes"||step.type==="eliminated")){
      const c=round.clues.find(c=>c.speaker===p.id);
      if(c) clue=`<div class="bubble show">“${c.text}”</div>`;
    }
    if(round && (step.type==="suspicion"||step.type==="votes"||step.type==="eliminated")){
      const b=round.beliefs.find(b=>b.observer===p.id);
      if(b){
        const rows=Object.entries(b.distribution).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([pid,pr])=>{
          const hit=pid===G.undercover_id;
          return `<div class="row"><span class="who">${pid}</span>
            <span class="track"><i class="fill${hit?' hit':''}" style="width:${Math.round(pr*100)}%"></i></span>
            <span class="pct">${Math.round(pr*100)}%</span></div>`;
        }).join("");
        susp=`<div class="susp show">${rows}</div>`;
      }
    }
    el.innerHTML=`<div class="avatar">${initial}</div>
      <div class="name">${p.id}</div>
      <div class="word">${p.secret||"?"}</div>
      ${p.id===G.undercover_id?'<div class="tag">UNDERCOVER</div>':''}
      ${clue}${susp}`;
    playersEl.appendChild(el);
  });
}

function renderLines(step){
  board.innerHTML="";
  if(!step.r&&step.r!==0) return;
  const round=G.rounds[step.r];
  if(step.type==="suspicion"){
    round.beliefs.forEach(b=>{
      const from=positions[b.observer], to=positions[b.top];
      if(!from||!to) return;
      drawArrow(from,to,b.top===G.undercover_id?"var(--good)":"rgba(139,125,255,.5)",1+b.top_prob*5);
    });
  }
  if(step.type==="votes"||step.type==="eliminated"){
    round.votes.forEach(v=>{
      const from=positions[v.voter], to=positions[v.target];
      if(!from||!to) return;
      drawArrow(from,to,"var(--warn)",2.2);
    });
  }
}
function drawArrow(a,b,color,w){
  const ns="http://www.w3.org/2000/svg";
  const line=document.createElementNS(ns,"line");
  line.setAttribute("x1",a.x);line.setAttribute("y1",a.y);
  line.setAttribute("x2",b.x);line.setAttribute("y2",b.y);
  line.setAttribute("stroke",color);line.setAttribute("stroke-width",w);
  line.setAttribute("stroke-linecap","round");line.setAttribute("opacity","0.7");
  board.appendChild(line);
}

function renderVotes(step){
  votesEl.innerHTML="";
  if(step.r===undefined) return;
  if(step.type!=="votes"&&step.type!=="eliminated") return;
  const round=G.rounds[step.r];
  Object.entries(round.tally||{}).forEach(([pid,n])=>{
    const pos=positions[pid]; if(!pos) return;
    const b=document.createElement("div");
    b.className="vote-badge show";
    b.style.left=(pos.x+42)+"px"; b.style.top=(pos.y-38)+"px";
    b.textContent="🗳 "+n;
    votesEl.appendChild(b);
  });
}

const PHASE={intro:"Words dealt",clues:"Clues",suspicion:"Suspicion",votes:"Voting",eliminated:"Elimination",result:"Result"};
function render(){
  const step=steps[cur];
  layout();
  renderPlayers(step);
  renderLines(step);
  renderVotes(step);
  const round=step.r!==undefined?G.rounds[step.r]:null;
  $("#rdlabel").textContent = round?`Round ${round.index+1}`:(step.type==="result"?"Final":"Setup");
  $("#phaselabel").textContent = PHASE[step.type]||"";
  const pct = steps.length>1 ? 100*cur/(steps.length-1) : 0;
  $("#prog").style.width = pct+"%";

  // event log
  const log=$("#log"); log.innerHTML="";
  const shown = steps.slice(0,cur+1).filter(s=>s.type!=="intro");
  shown.forEach(s=>{
    const r=s.r!==undefined?G.rounds[s.r]:null;
    let html="";
    if(s.type==="clues"&&r) html=`<b>R${r.index+1}</b> clues spoken`;
    else if(s.type==="suspicion"&&r) html=`<b>R${r.index+1}</b> beliefs updated`;
    else if(s.type==="votes"&&r){const t=Object.entries(r.tally).sort((a,b)=>b[1]-a[1]).map(([p,n])=>`${p}×${n}`).join(", ");html=`<b>R${r.index+1}</b> votes: ${t}`;}
    else if(s.type==="eliminated"&&r&&r.eliminated){const spy=r.eliminated===G.undercover_id;html=`<b>${r.eliminated}</b> eliminated — ${spy?'<span style="color:var(--good)">was the undercover ✓</span>':'<span style="color:var(--spy)">civilian ✗</span>'}`;}
    else if(s.type==="result") html=`<b>${G.winner==="civilian"?"Civilians":"Undercover"} win</b>`;
    if(html){const d=document.createElement("div");d.className="ev";d.innerHTML=html;log.appendChild(d);}
  });
  log.scrollTop=log.scrollHeight;

  const win=$("#winner");
  if(step.type==="result"){
    win.classList.add("show");
    const civ=G.winner==="civilian";
    $("#winbig").textContent=civ?"CIVILIANS WIN":"UNDERCOVER WINS";
    $("#winbig").style.color=civ?"var(--good)":"var(--spy)";
    $("#winsmall").textContent=`${G.rounds_played} round(s) · undercover was ${G.undercover_id} (${wordOf(G.undercover_id)})`;
  } else win.classList.remove("show");

  $("#prev").disabled=cur===0; $("#next").disabled=cur===steps.length-1;
}
function wordOf(id){const p=G.players.find(p=>p.id===id);return p?p.secret:"?";}

function go(i){cur=Math.max(0,Math.min(steps.length-1,i));render();}
function play(){
  if(cur>=steps.length-1) cur=0;
  playing=true; $("#play").textContent="❚❚ Pause";
  clearInterval(timer);
  timer=setInterval(()=>{
    if(cur>=steps.length-1){stop();return;}
    go(cur+1);
  }, parseInt($("#speed").value));
  render();
}
function stop(){playing=false;$("#play").textContent="▶ Play";clearInterval(timer);}

function loadGame(idx){
  stop(); G=GAMES[idx]; steps=buildSteps(G); cur=0;
  $("#m-players").textContent=G.players.length;
  $("#m-backend").textContent=G.backend||"offline";
  $("#m-spy").textContent=`${G.undercover_id} (${wordOf(G.undercover_id)})`;
  const civ=G.winner==="civilian";
  $("#m-winner").innerHTML=`<span class="pill ${civ?'civ':'spy'}">${civ?'Civilians':'Undercover'}</span>`;
  render();
}

// init
(function(){
  const sel=$("#gamesel");
  GAMES.forEach((g,i)=>{const o=document.createElement("option");o.value=i;o.textContent=`#${i+1} · ${g.players.length}p · ${g.winner==="civilian"?"civ":"spy"} win`;sel.appendChild(o);});
  sel.onchange=e=>loadGame(+e.target.value);
  $("#play").onclick=()=>playing?stop():play();
  $("#next").onclick=()=>{stop();go(cur+1);};
  $("#prev").onclick=()=>{stop();go(cur-1);};
  $("#speed").onchange=()=>{if(playing)play();};
  window.addEventListener("resize",()=>render());
  document.addEventListener("keydown",e=>{if(e.key===" "){e.preventDefault();playing?stop():play();}if(e.key==="ArrowRight"){stop();go(cur+1);}if(e.key==="ArrowLeft"){stop();go(cur-1);}});
  if(GAMES.length) loadGame(0);
  else document.querySelector(".stage").innerHTML="<p style='padding:40px'>No game data baked in.</p>";
})();
</script>
</body>
</html>
